<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>RYC Care+</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback: encode the requested path into a query
      // string and redirect to index.html, which restores it before React
      // mounts. See https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // keep "/rytc-care-plus"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
